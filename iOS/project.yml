name: CoolantLog
options:
  bundleIdPrefix: com.shimondeitel.coolantlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  CoolantLog:
    type: application
    platform: iOS
    sources:
      - path: CoolantLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.coolantlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CoolantLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  CoolantLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoolantLogTests
      - path: CoolantLog.storekit
    dependencies:
      - target: CoolantLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.coolantlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  CoolantLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoolantLogUITests
    dependencies:
      - target: CoolantLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.coolantlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CoolantLog:
    build:
      targets:
        CoolantLog: all
        CoolantLogTests: [test]
        CoolantLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: CoolantLog.storekit
    test:
      config: Debug
      storeKitConfiguration: CoolantLog.storekit
      targets:
        - CoolantLogTests
        - CoolantLogUITests
    archive:
      config: Release
